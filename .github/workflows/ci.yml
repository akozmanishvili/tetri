name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API · typecheck & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tetri
          POSTGRES_PASSWORD: tetri
          POSTGRES_DB: tetri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tetri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace=api
      - run: npm run typecheck --workspace=api
      - run: npm test --workspace=api

  web:
    name: Web · lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=web
      - run: npm run build --workspace=web

  deploy:
    name: Deploy to AWS
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace=api

      - name: Build
        run: |
          npm run build --workspace=web
          npm run build:lambda --workspace=api

      - name: Apply database migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy
        working-directory: infra
        run: npx cdk deploy TetriStack --require-approval never
